<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chenab College Shorkot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 min-h-screen flex flex-col items-center justify-between p-4 relative overflow-hidden text-slate-100">

    <!-- Background Decorative Glow Effects -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full flex-1 flex items-center justify-center py-6">
        <!-- Login Card -->
        <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 rounded-3xl shadow-2xl p-8 sm:p-10 relative z-10">
            
            <!-- Header with Official Logo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white p-2 shadow-xl shadow-indigo-600/20 mb-4 ring-4 ring-indigo-500/20">
                    <img src="logo.png" onerror="this.onerror=null; this.src='logo.jpg';" alt="CCS Logo" class="max-h-full max-w-full object-contain">
                </div>
                <h1 class="text-2xl font-black text-white uppercase tracking-tight">Chenab College</h1>
                <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest mt-0.5">Shorkot</p>
                <p class="text-slate-400 text-xs mt-2 font-medium">Exam & Result Management System</p>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Username Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="username" required placeholder="Enter username" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-700/80 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-500">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300">Password</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="Enter password" 
                            class="w-full pl-10 pr-10 py-3 bg-slate-950/60 border border-slate-700/80 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-500">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-white transition-colors">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Notification -->
                <div id="errorAlert" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl text-center font-medium">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid Username or Password!
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-bold rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Developer Credit Card Badge -->
            <div class="mt-8 pt-5 border-t border-slate-800/80 text-center">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-950/80 border border-indigo-500/30 shadow-inner">
                    <i class="fa-solid fa-code text-indigo-400 text-xs"></i>
                    <span class="text-[11px] text-slate-400">Developed by: <b class="text-white font-semibold">Muhammad Qaiser Abbas</b></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-3 text-xs text-slate-500 relative z-10">
        <p>© 2026 Chenab College Shorkot. All Rights Reserved.</p>
    </footer>

    <!-- Login Logic -->
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('errorAlert');

            if (user === 'admin' && pass === '12345') {
                localStorage.setItem('adminLoggedIn', 'true');
                alertBox.classList.add('hidden');
                window.location.href = 'dashboard.html';
            } else {
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
