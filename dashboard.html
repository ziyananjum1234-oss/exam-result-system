                if (savedMarks && typeof savedMarks === 'object' && Object.keys(savedMarks).length > 0) {

        initDataStore();

        // ================= DYNAMIC CLASSES & SECTIONS POPULATION ENGINE =================
        window.getUniqueClasses = function() {
            let list = [...masterClassesList];
            if (Array.isArray(studentsList)) {
                studentsList.forEach(s => { if (s && s.class && !list.includes(s.class)) list.push(s.class); });
            }
            if (Array.isArray(examsSetupList)) {
                examsSetupList.forEach(ex => {
                    if (ex && Array.isArray(ex.classes)) ex.classes.forEach(c => { if (c && !list.includes(c)) list.push(c); });
                });
            }
            return list;
        };

        window.getUniqueSections = function() {
            let list = [...masterSectionsList];
            if (Array.isArray(studentsList)) {
                studentsList.forEach(s => { if (s && s.group && !list.includes(s.group)) list.push(s.group); });
            }
            return list;
        };

        window.refreshAllExamDropdowns = function() {
            const dropdownIds = ['me_examSelect', 'cr_examSelect', 'ana_examSelect', 'dmc_examSelect', 'ds_examSelect', 'comb_finalExamSelect'];
            dropdownIds.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const curVal = el.value;
                el.innerHTML = '';
                if (!examsSetupList || examsSetupList.length === 0) {
                    el.innerHTML = '<option value="">No Exams Defined Yet</option>';
                    return;
                }
                examsSetupList.forEach((ex, idx) => {
                    if (!ex) return;
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.textContent = `${ex.name} (${ex.session})`;
                    if (curVal && ex.id === curVal) opt.selected = true;
                    else if (!curVal && idx === 0) opt.selected = true;
                    el.appendChild(opt);
                });
            });
        };

        // ================= TAB SWITCHING =================
        window.showTab = function(tabName) {
            try {
                const sectionMap = {
                    'enrollment': 'enrollmentSection',
                    'classList': 'classListSection',
                    'examSetup': 'examSetupSection',
                    'dateSheet': 'dateSheetSection',
                    'marksEntry': 'marksEntrySection',
                    'consolidated': 'consolidatedSection',
                    'resultAnalytics': 'resultAnalyticsSection',
                    'dmc': 'dmcSection',
                    'combined': 'combinedSection'
                };

                const buttonMap = {
                    'enrollment': 'navEnrollBtn',
                    'classList': 'navClassBtn',
                    'examSetup': 'navExamBtn',
                    'dateSheet': 'navDateSheetBtn',
                    'marksEntry': 'navMarksBtn',
                    'consolidated': 'navConsolidatedBtn',
                    'resultAnalytics': 'navAnalyticsBtn',
                    'dmc': 'navDmcBtn',
                    'combined': 'navCombinedBtn'
                };

                const inactiveStyle = "w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 font-medium text-xs transition-all text-left";
                const activeStyle = "w-full flex items-center space-x-3 px-3 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 transition-all text-left";

                for (let key in sectionMap) {
                    const sec = document.getElementById(sectionMap[key]);
                    const btn = document.getElementById(buttonMap[key]);
                    if (sec) sec.classList.add('hidden');
                    if (btn) btn.className = inactiveStyle;
                }

                const targetSec = document.getElementById(sectionMap[tabName]);
                const targetBtn = document.getElementById(buttonMap[tabName]);

                if (targetSec) targetSec.classList.remove('hidden');
                if (targetBtn) targetBtn.className = activeStyle;

                window.refreshAllExamDropdowns();

                if (tabName === 'enrollment') window.renderStudentsTable();
                else if (tabName === 'classList') window.renderClassWiseList();
                else if (tabName === 'examSetup') { window.renderSubjectRows(); window.renderExamsTable(); }
                else if (tabName === 'dateSheet') { window.loadDateSheetConfig(); }
                else if (tabName === 'marksEntry') { window.onExamOrClassChange(); }
                else if (tabName === 'consolidated') { window.generateConsolidatedSheet(false); }
                else if (tabName === 'resultAnalytics') { window.loadAnalyticsData(); }
                else if (tabName === 'dmc') { window.onDmcExamOrClassChange(); }
                else if (tabName === 'combined') { window.onCombinedClassChange(); }
            } catch (err) {
                console.error("Tab switch error:", err);
            }
        };

        // ================= TAB 5: MARKS ENTRY (WITH ABSENT 'A' & LEAVE 'L') =================
        window.onExamOrClassChange = function() {
            const examSelect = document.getElementById('me_examSelect');
            const subSelect = document.getElementById('me_subjectSelect');
            if (!examSelect || !subSelect) return;

            const examId = examSelect.value;
            subSelect.innerHTML = '';

            const exam = examsSetupList.find(e => e.id === examId);
            if (!exam || !exam.subjects || exam.subjects.length === 0) {
                subSelect.innerHTML = '<option value="">No subjects found for this exam</option>';
                window.loadSubjectMarksTable();
                return;
            }

            exam.subjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.name;
                opt.textContent = `${sub.name} (Max: ${sub.marks} Marks)`;
                subSelect.appendChild(opt);
            });

            window.renderSubjectProgressTracker();
            window.loadSubjectMarksTable();
        };

        window.renderSubjectProgressTracker = function() {
            const examSelect = document.getElementById('me_examSelect');
            const classSelect = document.getElementById('me_classSelect');
            const container = document.getElementById('subjectProgressContainer');

            if (!examSelect || !classSelect || !container) return;

            const examId = examSelect.value;
            const selectedClass = classSelect.value;
            container.innerHTML = '';

            const exam = examsSetupList.find(e => e.id === examId);
            if (!exam) return;

            const classStudents = studentsList.filter(s => s.class === selectedClass && (s.status || 'Active') !== 'Left');
            const totalStudents = classStudents.length;
            const subjects = Array.isArray(exam.subjects) ? exam.subjects : [];

            subjects.forEach(sub => {
                let enteredCount = 0;
                classStudents.forEach(s => {
                    const key = `${examId}_${s.rollNo}`;
                    if (marksDatabase[key] && marksDatabase[key][sub.name] !== undefined && marksDatabase[key][sub.name] !== '') {
                        enteredCount++;
                    }
                });

                const isComplete = totalStudents > 0 && enteredCount === totalStudents;
                const isPending = enteredCount === 0;

                let colorStyle = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                let icon = '<i class="fa-solid fa-clock mr-1"></i>';
                if (isComplete) {
                    colorStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                    icon = '<i class="fa-solid fa-circle-check mr-1"></i>';
                } else if (isPending) {
                    colorStyle = 'bg-slate-800 text-slate-400 border-slate-700';
                    icon = '<i class="fa-solid fa-circle mr-1"></i>';
                }

                const badge = document.createElement('div');
                badge.className = `px-3 py-1.5 rounded-xl border text-xs font-semibold flex items-center gap-1.5 ${colorStyle}`;
                badge.innerHTML = `
                    <span>${icon} <b>${sub.name}</b>:</span>
                    <span>${enteredCount}/${totalStudents}</span>
                    <span class="text-[10px] opacity-75">${totalStudents > 0 ? ((enteredCount/totalStudents)*100).toFixed(0) : 0}%</span>
                `;
                container.appendChild(badge);
            });
        };

        window.loadSubjectMarksTable = function() {
            const examSelect = document.getElementById('me_examSelect');
            const classSelect = document.getElementById('me_classSelect');
            const subSelect = document.getElementById('me_subjectSelect');
            const tbody = document.getElementById('subjectMarksTableBody');
            
            if (!examSelect || !classSelect || !subSelect || !tbody) return;

            const examId = examSelect.value;
            const selectedClass = classSelect.value;
            const selectedSubject = subSelect.value;
            tbody.innerHTML = '';

            const exam = examsSetupList.find(e => e.id === examId);
            if (!exam) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-500">Please define an Exam first in Exam Setup tab.</td></tr>';
                return;
            }

            const subjects = Array.isArray(exam.subjects) ? exam.subjects : [];
            const subObj = subjects.find(s => s.name === selectedSubject) || { name: selectedSubject, marks: 100 };
            
            const badgeEl = document.getElementById('activeSubjectBadge');
            const thMaxEl = document.getElementById('thMaxMarks');
            if (badgeEl) badgeEl.textContent = `${subObj.name} (Max: ${subObj.marks} Marks)`;
            if (thMaxEl) thMaxEl.textContent = `(Max: ${subObj.marks})`;

            const classStudents = studentsList.filter(s => s.class === selectedClass && (s.status || 'Active') !== 'Left');

            if (classStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500 font-medium">No active students found in "${selectedClass}". Please add students in Student Enrollment first!</td></tr>`;
                return;
            }

            classStudents.forEach((s, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition-colors";

                const key = `${examId}_${s.rollNo}`;
                const savedVal = (marksDatabase[key] && marksDatabase[key][selectedSubject] !== undefined) ? marksDatabase[key][selectedSubject] : '';

                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-center font-bold text-slate-400">${idx + 1}</td>
                    <td class="py-2.5 px-4 font-mono font-bold text-indigo-400">${s.rollNo}</td>
                    <td class="py-2.5 px-4 font-bold text-white">${s.name}</td>
                    <td class="py-2.5 px-4 text-slate-400">${s.father}</td>
                    <td class="py-2 px-4 text-center">
                        <input type="text" placeholder="0-${subObj.marks} / A / L"
                            value="${savedVal}"
                            data-roll="${s.rollNo}" 
                            data-index="${idx}"
                            oninput="this.value = this.value.toUpperCase()"
                            onkeydown="window.handleMarksEnterKey(event, ${idx})"
                            class="marks-input-single w-28 px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white font-mono font-bold text-center focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.handleMarksEnterKey = function(event, currentIndex) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const inputs = document.querySelectorAll('.marks-input-single');
                if (currentIndex + 1 < inputs.length) {
                    inputs[currentIndex + 1].focus();
                    inputs[currentIndex + 1].select();
                } else {
                    window.saveCurrentSubjectMarks();
                }
            }
        };

        window.saveCurrentSubjectMarks = function() {
            const examSelect = document.getElementById('me_examSelect');
            const subSelect = document.getElementById('me_subjectSelect');

            if (!examSelect || !subSelect) return;

            const examId = examSelect.value;
            const selectedSubject = subSelect.value;

            if (!examId || !selectedSubject) {
                alert('Please select an examination and subject!');
                return;
            }

            const inputs = document.querySelectorAll('.marks-input-single');
            if (inputs.length === 0) {
                alert('No student marks to save!');
                return;
            }

            const exam = examsSetupList.find(e => e.id === examId);
            const subObj = (exam && Array.isArray(exam.subjects)) ? exam.subjects.find(s => s.name === selectedSubject) : null;
            const maxM = subObj ? parseInt(subObj.marks) || 100 : 100;

            inputs.forEach(input => {
                const rollNo = input.getAttribute('data-roll');
                const val = input.value.trim().toUpperCase();

                const key = `${examId}_${rollNo}`;
                if (!marksDatabase[key]) {
                    marksDatabase[key] = {};
                }

                if (val !== '') {
                    if (val === 'A' || val === 'ABSENT') {
                        marksDatabase[key][selectedSubject] = 'A';
                    } else if (val === 'L' || val === 'LEAVE') {
                        marksDatabase[key][selectedSubject] = 'L';
                    } else {
                        const parsed = parseInt(val);
                        marksDatabase[key][selectedSubject] = isNaN(parsed) ? 0 : Math.min(parsed, maxM);
                    }
                } else {
                    delete marksDatabase[key][selectedSubject];
                }
            });

            localStorage.setItem('ccs_marks_database', JSON.stringify(marksDatabase));
            window.renderSubjectProgressTracker();
            alert(`Success: Marks for "${selectedSubject}" saved successfully!`);
        };

        // ================= TAB 6: CONSOLIDATIVE RESULT SHEET =================
        window.generateConsolidatedSheet = function(blankMode = false) {

                const classSelect = document.getElementById('cr_classSelect');
                const passSelect = document.getElementById('cr_passPct');

                const examId = examSelect.value;
                const selectedClass = classSelect.value;
                const passCriteria = parseInt(passSelect.value) || 33;

                const thead = document.getElementById('consolidatedTableHead');
                const tbody = document.getElementById('consolidatedTableBody');
                const docTitle = document.getElementById('cr_docTitle');

                if (!thead || !tbody) return;
                thead.innerHTML = '';
                tbody.innerHTML = '';

                const exam = examsSetupList.find(e => e.id === examId);
                if (!exam) {
                    tbody.innerHTML = '<tr><td colspan="12" class="text-center py-6 text-slate-500">Please define an Exam first in Exam Setup tab.</td></tr>';
                    return;
                }

                document.getElementById('cr_printExamTitle').textContent = exam.name;
                document.getElementById('cr_printClassTitle').textContent = selectedClass;
                document.getElementById('cr_printDate').textContent = new Date().toLocaleDateString('en-GB');

                if (blankMode) {
                    docTitle.textContent = "BLANK MASTER MARKS AWARD LIST (TEACHER EVALUATION SHEET)";
                } else {
                    docTitle.textContent = "CONSOLIDATIVE RESULT SHEET";
                }

                const subjects = Array.isArray(exam.subjects) ? exam.subjects : [];

                let headHtml = `
                    <tr>
                        <th class="py-2.5 px-2 text-center w-10">Sr #</th>
                        <th class="py-2.5 px-2 w-16">Roll No</th>
                        <th class="py-2.5 px-3">Student Name</th>
                        <th class="py-2.5 px-3">Father Name</th>
                `;
                subjects.forEach(sub => {
                    headHtml += `<th class="py-2.5 px-2 text-center min-w-[70px]">${sub.name} <span class="block text-[9px] text-slate-500">(${sub.marks})</span></th>`;
                });

                if (blankMode) {
                    headHtml += `
                        <th class="py-2.5 px-2 text-center min-w-[80px]">Total Obt</th>
                        <th class="py-2.5 px-2 text-center min-w-[80px]">Teacher Sign</th>
                    </tr>`;
                } else {
                    headHtml += `
                        <th class="py-2.5 px-2 text-center">Total</th>
                        <th class="py-2.5 px-2 text-center">Obt</th>
                        <th class="py-2.5 px-2 text-center">%</th>
                        <th class="py-2.5 px-2 text-center">Grade</th>
                        <th class="py-2.5 px-2 text-center">Status</th>
                        <th class="py-2.5 px-2 text-center">Position</th>
                    </tr>`;
                }
                thead.innerHTML = headHtml;

                const classStudents = studentsList.filter(s => s.class === selectedClass && (s.status || 'Active') !== 'Left');

                if (classStudents.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${10 + subjects.length}" class="text-center py-6 text-slate-500 font-medium">No active students enrolled in "${selectedClass}".</td></tr>`;
                    window.updateConsolidatedStats(0, 0, 0, 0, "-");
                    return;
                }

                const totalMaxMarks = subjects.reduce((sum, s) => sum + (parseInt(s.marks) || 0), 0);
                let studentResults = [];

                classStudents.forEach((s, idx) => {
                    if (blankMode) {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 h-8";

                        let rowHtml = `
                            <td class="py-2 px-2 text-center font-bold">${idx + 1}</td>
                            <td class="py-2 px-2 font-mono font-bold text-slate-900">${s.rollNo}</td>
                            <td class="py-2 px-3 font-bold text-slate-900">${s.name}</td>
                            <td class="py-2 px-3 text-slate-700">${s.father}</td>
                        `;

                        subjects.forEach(() => {
                            rowHtml += `<td class="py-2 px-2 text-center border-slate-300"></td>`;
                        });

                        rowHtml += `
                            <td class="py-2 px-2 text-center border-slate-300"></td>
                            <td class="py-2 px-2 text-center border-slate-300"></td>
                        `;
                        tr.innerHTML = rowHtml;
                        tbody.appendChild(tr);
                    } else {
                        const key = `${examId}_${s.rollNo}`;
                        const savedMarks = marksDatabase[key] || {};

                        let totalObt = 0;
                        let isSubjectFail = false;
                        let hasMarks = false;
                        let subMarksMap = {};

                        subjects.forEach(sub => {
                            const rawVal = savedMarks[sub.name];
                            let obt = 0;
                            const subPassMin = (parseInt(sub.marks) * passCriteria) / 100;

                            if (rawVal !== undefined && rawVal !== '') {
                                hasMarks = true;
                                if (rawVal === 'A' || rawVal === 'Absent') {
                                    isSubjectFail = true;
                                    subMarksMap[sub.name] = 'A';
                                } else if (rawVal === 'L' || rawVal === 'Leave') {
                                    isSubjectFail = true;
                                    subMarksMap[sub.name] = 'L';
                                } else {
                                    obt = parseInt(rawVal) || 0;
                                    totalObt += obt;
                                    subMarksMap[sub.name] = obt;
                                    if (obt < subPassMin) {
                                        isSubjectFail = true;
                                    }
                                }
                            } else {
                                subMarksMap[sub.name] = '-';
                            }
                        });

                        const percentage = totalMaxMarks > 0 ? parseFloat(((totalObt / totalMaxMarks) * 100).toFixed(1)) : 0;

                        let grade = 'F';
                        if (percentage >= 80) grade = 'A+';
                        else if (percentage >= 70) grade = 'A';
                        else if (percentage >= 60) grade = 'B';
                        else if (percentage >= 50) grade = 'C';
                        else if (percentage >= 40) grade = 'D';
                        else grade = 'E';

                        const isPass = hasMarks && !isSubjectFail && percentage >= passCriteria;
                        if (!isPass) grade = 'F';

                        studentResults.push({
                            rollNo: s.rollNo,
                            name: s.name,
                            father: s.father,
                            subMarksMap,
                            totalMaxMarks,
                            totalObt,
                            percentage,
                            grade,
                            status: isPass ? 'PASS' : 'FAIL',
                            hasMarks
                        });
                    }
                });

                if (!blankMode) {
                    const passedStudents = studentResults.filter(s => s.status === 'PASS').sort((a, b) => b.totalObt - a.totalObt);

                    passedStudents.forEach((s, idx) => {
                        if (idx === 0) s.position = '1st 🥇';
                        else if (idx === 1) s.position = '2nd 🥈';
                        else if (idx === 2) s.position = '3rd 🥉';
                        else s.position = `${idx + 1}th`;
                    });

                    studentResults.forEach(s => {
                        if (s.status !== 'PASS') s.position = '-';
                    });

                    currentConsolidatedRows = studentResults;

                    let passedCount = 0;
                    let failedCount = 0;

                    studentResults.forEach((s, idx) => {
                        if (s.status === 'PASS') passedCount++; else failedCount++;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50";

                        let rowHtml = `
                            <td class="py-2 px-2 text-center font-bold">${idx + 1}</td>
                            <td class="py-2 px-2 font-mono font-bold text-slate-900">${s.rollNo}</td>
                            <td class="py-2 px-3 font-bold text-slate-900">${s.name}</td>
                            <td class="py-2 px-3 text-slate-700">${s.father}</td>
                        `;

                        subjects.forEach(sub => {
                            const val = s.subMarksMap[sub.name];
                            let markHtml = `<span class="text-slate-400">-</span>`;
                            if (val === 'A' || val === 'Absent') {
                                markHtml = `<span class="text-rose-600 font-black bg-rose-50 px-1.5 py-0.5 rounded text-[10px] border border-rose-200">A</span>`;
                            } else if (val === 'L' || val === 'Leave') {
                                markHtml = `<span class="text-amber-600 font-black bg-amber-50 px-1.5 py-0.5 rounded text-[10px] border border-amber-200">L</span>`;
                            } else if (val !== '-') {
                                const subPassMin = (parseInt(sub.marks) * passCriteria) / 100;
                                const isSubPass = parseInt(val) >= subPassMin;
                                const markColor = isSubPass ? 'text-slate-900 font-semibold' : 'text-rose-600 font-bold';
                                markHtml = `<span class="${markColor}">${val}</span>`;
                            }
                            rowHtml += `<td class="py-2 px-2 text-center">${markHtml}</td>`;
                        });

                        rowHtml += `
                            <td class="py-2 px-2 text-center font-bold text-slate-700">${s.totalMaxMarks}</td>
                            <td class="py-2 px-2 text-center font-bold text-slate-950 font-mono">${s.totalObt}</td>
                            <td class="py-2 px-2 text-center font-bold ${s.status === 'PASS' ? 'text-indigo-600' : 'text-rose-600'}">${s.percentage}%</td>
                            <td class="py-2 px-2 text-center font-black ${s.grade === 'A+' || s.grade === 'A' ? 'text-emerald-600' : (s.grade === 'F' ? 'text-rose-600' : 'text-indigo-600')}">${s.grade}</td>
                            <td class="py-2 px-2 text-center">
                                <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${s.status === 'PASS' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                    ${s.status}
                                </span>
                            </td>
                            <td class="py-2 px-2 text-center font-black text-amber-600">${s.position}</td>
                        `;

                        tr.innerHTML = rowHtml;
                        tbody.appendChild(tr);
                    });

                    const totalAppeared = studentResults.length;
                    const overallPassPct = totalAppeared > 0 ? ((passedCount / totalAppeared) * 100).toFixed(1) : 0;
                    const topStudent = passedStudents.length > 0 ? `${passedStudents[0].name} (${passedStudents[0].totalObt})` : "-";

                    window.updateConsolidatedStats(totalAppeared, passedCount, failedCount, overallPassPct, topStudent);
                } else {
                    window.updateConsolidatedStats(classStudents.length, "-", "-", "-", "-");
                }
            } catch (e) {
                console.error("Error in generateConsolidatedSheet:", e);
            }
        };

        window.printBlankMasterSheet = function() {
            window.showTab('consolidated');
            window.generateConsolidatedSheet(true);
            window.setPrintOrientation('landscape');
            setTimeout(() => { window.print(); }, 350);
        };

        window.printCalculatedGazette = function() {
            window.showTab('consolidated');
            window.generateConsolidatedSheet(false);
            window.setPrintOrientation('landscape');
            setTimeout(() => { window.print(); }, 350);
        };

        window.updateConsolidatedStats = function(total, pass, fail, pct, top) {
            const elApp = document.getElementById('cr_statAppeared');
            const elPass = document.getElementById('cr_statPassed');
            const elFail = document.getElementById('cr_statFailed');
            const elPct = document.getElementById('cr_statPassPct');
            const elTop = document.getElementById('cr_statTop');

            if (elApp) elApp.textContent = total;
            if (elPass) elPass.textContent = pass;
            if (elFail) elFail.textContent = fail;
            if (elPct) elPct.textContent = isNaN(pct) ? pct : `${pct}%`;
            if (elTop) elTop.textContent = top;

            const footTot = document.getElementById('cr_footTotal');
            const footPass = document.getElementById('cr_footPassed');
            const footFail = document.getElementById('cr_footFailed');
            const footPct = document.getElementById('cr_footPct');

            if (footTot) footTot.textContent = total;
            if (footPass) footPass.textContent = pass;
            if (footFail) footFail.textContent = fail;
            if (footPct) footPct.textContent = isNaN(pct) ? pct : `${pct}%`;
        };

        // ================= TAB 8: SINGLE EXAM RESULT CARD / DMC =================
        window.onDmcExamOrClassChange = function() {
            const classSelect = document.getElementById('dmc_classSelect');
            const studentSelect = document.getElementById('dmc_studentSelect');
            if (!classSelect || !studentSelect) return;

            const selectedClass = classSelect.value;
            studentSelect.innerHTML = '';

            const activeStudents = studentsList.filter(s => s.class === selectedClass && (s.status || 'Active') !== 'Left');

            if (activeStudents.length === 0) {
                studentSelect.innerHTML = '<option value="">No students in this class</option>';
                window.renderDmcCards();
                return;
            }

            const optAll = document.createElement('option');
            optAll.value = "ALL";
            optAll.textContent = `⭐ Bulk Print All Class DMCs (${activeStudents.length} Students)`;
            studentSelect.appendChild(optAll);

            activeStudents.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.rollNo;
                opt.textContent = `Roll #${s.rollNo} - ${s.name} (${s.father})`;
                studentSelect.appendChild(opt);
            });

            window.renderDmcCards();
        };

        window.renderDmcCards = function() {
            try {
                const examSelect = document.getElementById('dmc_examSelect');
                const classSelect = document.getElementById('dmc_classSelect');
                const studentSelect = document.getElementById('dmc_studentSelect');
                const container = document.getElementById('dmcCardsContainer');

                if (!examSelect || !classSelect || !studentSelect || !container) return;

                const examId = examSelect.value;
                const selectedClass = classSelect.value;
                const selectedRoll = studentSelect.value;

                container.innerHTML = '';

                const exam = examsSetupList.find(e => e.id === examId);
                if (!exam) {
                    container.innerHTML = '<div class="bg-slate-900 p-8 rounded-3xl text-center text-slate-500">Please define an examination first in Exam Setup.</div>';
                    return;
                }

                const classStudents = studentsList.filter(s => s.class === selectedClass && (s.status || 'Active') !== 'Left');
                if (classStudents.length === 0) {
                    container.innerHTML = `<div class="bg-slate-900 p-8 rounded-3xl text-center text-slate-500 font-medium">No active students enrolled in "${selectedClass}".</div>`;
                    return;
                }

                const passCriteria = exam.passPct || 33;
                const subjects = Array.isArray(exam.subjects) ? exam.subjects : [];
                const totalMaxMarks = subjects.reduce((sum, s) => sum + (parseInt(s.marks) || 0), 0);

                let evaluatedStudents = classStudents.map(s => {
                    const key = `${examId}_${s.rollNo}`;
                    const savedMarks = marksDatabase[key] || {};

                    let totalObt = 0;
                    let isSubjectFail = false;
                    let hasMarks = false;
                    let subjectsDetail = [];

                    subjects.forEach(sub => {
                        const maxM = parseInt(sub.marks) || 100;
                        const rawVal = savedMarks[sub.name];
                        let obt = 0;
                        let displayObt = '-';
                        let isPass = false;
                        let subGrade = 'F';
                        let subPct = 0;
                        let subStatus = 'FAIL';
                        const subPassMin = Math.ceil((maxM * passCriteria) / 100);

                        if (rawVal !== undefined && rawVal !== '') {
                            hasMarks = true;
                            if (rawVal === 'A' || rawVal === 'Absent') {
                                displayObt = 'Absent (A)';
                                isPass = false;
                                isSubjectFail = true;
                                subStatus = 'ABSENT';
                                subGrade = 'A';
                                subPct = 0;
                            } else if (rawVal === 'L' || rawVal === 'Leave') {
                                displayObt = 'Leave (L)';
                                isPass = false;
                                isSubjectFail = true;
                                subStatus = 'LEAVE';
                                subGrade = 'L';
                                subPct = 0;
                            } else {
                                obt = parseInt(rawVal) || 0;
                                displayObt = obt;
                                totalObt += obt;
                                isPass = obt >= subPassMin;
                                if (!isPass) isSubjectFail = true;
                                subPct = maxM > 0 ? ((obt / maxM) * 100).toFixed(0) : 0;
                                if (subPct >= 80) subGrade = 'A+';
                                else if (subPct >= 70) subGrade = 'A';
                                else if (subPct >= 60) subGrade = 'B';
                                else if (subPct >= 50) subGrade = 'C';
                                else if (subPct >= 40) subGrade = 'D';
                                subStatus = isPass ? 'PASS' : 'FAIL';
                            }
                        }

                        subjectsDetail.push({
                            name: sub.name,
                            maxMarks: maxM,
                            passMin: subPassMin,
                            obtained: displayObt,
                            pct: subPct,
                            grade: isPass ? subGrade : (rawVal === 'A' || rawVal === 'Absent' ? 'A' : (rawVal === 'L' || rawVal === 'Leave' ? 'L' : 'F')),
                            status: subStatus
                        });
                    });

                    const percentage = totalMaxMarks > 0 ? parseFloat(((totalObt / totalMaxMarks) * 100).toFixed(1)) : 0;

                    let grade = 'F';
                    if (percentage >= 80) grade = 'A+';
                    else if (percentage >= 70) grade = 'A';
                    else if (percentage >= 60) grade = 'B';
                    else if (percentage >= 50) grade = 'C';
                    else if (percentage >= 40) grade = 'D';
                    else grade = 'E';

                    const isOverallPass = hasMarks && !isSubjectFail && percentage >= passCriteria;
                    if (!isOverallPass) grade = 'F';

                    return {
                        rollNo: s.rollNo,
                        name: s.name,
                        father: s.father,
                        gender: s.gender,
                        group: s.group,
                        class: s.class,
                        subjectsDetail,
                        totalMaxMarks,
                        totalObt,
                        percentage,
                        grade,
                        status: isOverallPass ? 'PROMOTED / PASSED' : 'DETENTION / FAILED',
                        hasMarks
                    };
                });

                const passed = evaluatedStudents.filter(s => s.status.includes('PASS')).sort((a, b) => b.totalObt - a.totalObt);
                passed.forEach((s, idx) => {
                    if (idx === 0) s.position = '1st Position 🥇';
                    else if (idx === 1) s.position = '2nd Position 🥈';
                    else if (idx === 2) s.position = '3rd Position 🥉';
                    else s.position = `${idx + 1}th Position`;
                });
                evaluatedStudents.forEach(s => {
                    if (!s.status.includes('PASS')) s.position = '---';
                });

                let studentsToRender = evaluatedStudents;
                if (selectedRoll && selectedRoll !== "ALL") {
                    studentsToRender = evaluatedStudents.filter(s => s.rollNo === selectedRoll);
                }

                studentsToRender.forEach(st => {
                    const card = document.createElement('div');
                    card.className = "dmc-card-page print-paper bg-white text-slate-900 rounded-3xl p-6 sm:p-10 shadow-2xl border border-slate-200 max-w-4xl mx-auto";

                    let rowsHtml = '';
                    st.subjectsDetail.forEach(sub => {
                        const markColor = sub.status === 'PASS' ? 'text-slate-950 font-bold' : 'text-rose-600 font-bold';
                        rowsHtml += `
                            <tr class="hover:bg-slate-50 border-b border-slate-300">
                                <td class="py-2 px-3 font-bold uppercase text-slate-900">${sub.name}</td>
                                <td class="py-2 px-3 text-center text-slate-700">${sub.maxMarks}</td>
                                <td class="py-2 px-3 text-center text-slate-700">${sub.passMin}</td>
                                <td class="py-2 px-3 text-center ${markColor} font-mono">${sub.obtained}</td>
                                <td class="py-2 px-3 text-center font-bold text-slate-800">${sub.pct}%</td>
                                <td class="py-2 px-3 text-center font-black ${sub.grade === 'A+' || sub.grade === 'A' ? 'text-emerald-700' : 'text-slate-900'}">${sub.grade}</td>
                                <td class="py-2 px-3 text-center">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${sub.status === 'PASS' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${sub.status}</span>
                                </td>
                            </tr>
                        `;
                    });

                    card.innerHTML = `
                        <div>
                            <div class="border-b-2 border-slate-900 pb-4 mb-4 flex items-center justify-between gap-4">
                                <div class="w-16 h-16 flex-shrink-0 flex items-center justify-center">
                                    <img src="logo.png" onerror="this.onerror=null; this.src='logo.jpg';" alt="CCS Logo" class="max-h-full max-w-full object-contain">
                                </div>
                                <div class="text-center flex-1">
                                    <h1 class="text-2xl font-black uppercase tracking-tight text-slate-950">Chenab College Shorkot</h1>
                                    <p class="text-xs font-black text-slate-800 uppercase tracking-widest mt-0.5">DETAILED MARKS CERTIFICATE (DMC)</p>
                                    <span class="inline-block mt-1 px-3 py-0.5 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase">${exam.name}</span>
                                </div>
                                <div class="w-16 flex-shrink-0"></div>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-100 p-3 rounded-2xl mb-4 text-xs font-semibold text-slate-800">
                                <div><span class="text-slate-500 text-[10px] block">Roll Number</span><b class="text-slate-950 font-mono font-bold">${st.rollNo}</b></div>
                                <div><span class="text-slate-500 text-[10px] block">Student Name</span><b class="text-slate-950">${st.name}</b></div>
                                <div><span class="text-slate-500 text-[10px] block">Father Name</span><b class="text-slate-950">${st.father}</b></div>
                                <div><span class="text-slate-500 text-[10px] block">Class & Section</span><b class="text-indigo-900">${st.class} (${st.group})</b></div>
                            </div>

                            <div class="overflow-x-auto mb-4">
                                <table class="print-table w-full text-left text-xs">
                                    <thead>
                                        <tr class="bg-slate-200 text-slate-900 font-bold uppercase">
                                            <th class="py-2 px-3">Subject</th>
                                            <th class="py-2 px-3 text-center">Max Marks</th>
                                            <th class="py-2 px-3 text-center">Passing</th>
                                            <th class="py-2 px-3 text-center">Obtained</th>
                                            <th class="py-2 px-3 text-center">%</th>
                                            <th class="py-2 px-3 text-center">Grade</th>
                                            <th class="py-2 px-3 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rowsHtml}</tbody>
                                </table>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-900 text-white p-3 rounded-2xl text-center text-xs font-bold">
                                <div><span class="text-slate-400 text-[10px] block">Grand Total</span><span class="text-base">${st.totalObt} / ${st.totalMaxMarks}</span></div>
                                <div><span class="text-slate-400 text-[10px] block">Percentage</span><span class="text-base text-yellow-400">${st.percentage}%</span></div>
                                <div><span class="text-slate-400 text-[10px] block">Grade</span><span class="text-base text-emerald-400">${st.grade}</span></div>
                                <div><span class="text-slate-400 text-[10px] block">Position</span><span class="text-base text-amber-300">${st.position}</span></div>
                            </div>
                        </div>

                        <div class="mt-8 pt-4 border-t-2 border-slate-900 flex justify-between items-end text-xs font-bold text-slate-800">
                            <div class="text-center"><div class="w-36 border-b border-slate-900 mb-1"></div><span>Class Incharge</span></div>
                            <div class="text-center"><div class="w-36 border-b border-slate-900 mb-1"></div><span>Controller Examinations</span></div>
                            <div class="text-center"><div class="w-36 border-b border-slate-900 mb-1"></div><span>Principal Signature</span></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch(e) {
                console.error("Error in renderDmcCards:", e);
            }
        };

        window.printAllClassDMCs = function() {
            const sel = document.getElementById('dmc_studentSelect');
            if (sel) sel.value = "ALL";
            window.renderDmcCards();
            window.printPortraitView();
        };

        window.onload = function() {
            window.refreshAllClassAndSectionDropdowns();
            window.showTab('enrollment');
        };
    </script>
